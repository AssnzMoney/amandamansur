<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#362019" />
      <stop offset="70%" stop-color="#211713" />
      <stop offset="100%" stop-color="#140d0a" />
    </radialGradient>
    
    <!-- Gold Gradient for Star -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#F7DFB0" />
      <stop offset="60%" stop-color="#D9A441" />
      <stop offset="100%" stop-color="#9E6F1D" />
    </linearGradient>

    <!-- Center Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#F7DFB0" stop-opacity="0.6" />
      <stop offset="55%" stop-color="#D9A441" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D9A441" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Luxury Circular Container -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="#D9A441" stroke-width="2.5" />
  <circle cx="64" cy="64" r="56" fill="none" stroke="#F6E4C5" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Outer Star Glow -->
  <circle cx="64" cy="64" r="38" fill="url(#starGlow)" />

  <!-- 8-Point Essence Star -->
  <!-- Horizontal & Vertical Long Rays -->
  <polygon points="64,18 69,59 110,64 69,69 64,110 59,69 18,64 59,59" fill="url(#goldGrad)" />
  
  <!-- Diagonal Shorter Rays -->
  <polygon points="64,34 67,61 94,64 67,67 64,94 61,67 34,64 61,61" fill="url(#goldGrad)" transform="rotate(45 64 64)" opacity="0.9" />

  <!-- Central Diamond Flare -->
  <circle cx="64" cy="64" r="4.5" fill="#FFFFFF" />
</svg>
